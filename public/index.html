<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐭の颜文字墙 ～ (｡･ω･｡)</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: linear-gradient(180deg, #FFFDF0 0%, #FFF8CC 40%, #FFF5A5 100%);
  min-height: 100vh;
  overflow: hidden;
  font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  position: relative;
  -webkit-tap-highlight-color: transparent;
}

.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 12px 20px;
  background: linear-gradient(90deg, #FFFADC 0%, #FFF5A5 45%, #FFED6B 100%);
  border-bottom: 2.5px dashed #FFD54F;
  box-shadow: 0 3px 12px rgba(255, 237, 107, 0.25);
}
.header-icon {
  width: 32px; height: 32px;
  background: url('https://i.postimg.cc/44Lbdy7K/1773404738205.png') center/contain no-repeat;
  image-rendering: pixelated;
  animation: wiggle 2.8s ease-in-out infinite;
  filter: drop-shadow(0 2px 4px rgba(255,213,79,.35));
}
@keyframes wiggle {
  0%,100%{transform:translateX(0) translateY(0) rotate(0deg)}
  8%{transform:translateX(-2px) translateY(-1px) rotate(-6deg)}
  16%{transform:translateX(0) translateY(-3px) rotate(0deg)}
  24%{transform:translateX(2px) translateY(-1px) rotate(6deg)}
  32%{transform:translateX(0) translateY(0) rotate(0deg)}
  50%{transform:translateX(0) translateY(-4px) rotate(2deg)}
  75%{transform:translateX(0) translateY(0) rotate(0deg)}
}
.header-title {
  color: #D05D1A; font-weight: 700; font-size: 1.1em;
  text-shadow: 0 1px 2px rgba(255,255,255,0.6); letter-spacing: 1px;
}
.header-toast {
  width: 32px; height: 32px;
  background: url('https://i.postimg.cc/t482CD77/1773325087190.png') center/contain no-repeat;
  image-rendering: pixelated;
  animation: toastBounce 3.2s ease-in-out infinite;
  filter: drop-shadow(0 2px 4px rgba(255,213,79,.35));
}
@keyframes toastBounce {
  0%{transform:translateY(0) rotate(0deg) scale(1,1)}
  5%{transform:translateY(1px) rotate(0deg) scale(1.02,0.97)}
  14%{transform:translateY(-8px) rotate(4deg) scale(0.96,1.06)}
  26%{transform:translateY(0) rotate(0deg) scale(1.08,0.92)}
  36%{transform:translateY(-4px) rotate(-2deg) scale(0.98,1.03)}
  42%{transform:translateY(0) rotate(0deg) scale(1.04,0.95)}
  52%,100%{transform:translateY(0) rotate(0deg) scale(1,1)}
}

.danmaku-stage {
  position: fixed; top: 60px; left: 0; right: 0; bottom: 80px;
  overflow: hidden; pointer-events: none;
}

.danmaku-item {
  position: absolute;
  top: 0; left: 0;
  white-space: nowrap;
  pointer-events: auto;
  cursor: pointer;
  padding: 6px 16px;
  border-radius: 20px;
  background: rgba(255, 253, 240, 0.88);
  border: 1.5px solid rgba(255, 213, 79, 0.45);
  box-shadow: 0 2px 8px rgba(255, 237, 107, 0.25);
  color: #D05D1A;
  font-weight: 700;
  font-size: 1.2em;
  user-select: none;
  will-change: transform;
  transition: background 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  touch-action: manipulation;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
/* ★新增：自己投的弹幕高亮★ */
.danmaku-item.mine {
  background: linear-gradient(135deg, rgba(255,230,130,0.95), rgba(255,200,120,0.95));
  border-color: #F5A623;
  box-shadow: 0 2px 12px rgba(245, 166, 35, 0.35);
}
.danmaku-item.flash {
  background: rgba(255, 230, 130, 1) !important;
  border-color: #F5A623;
  box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.3);
  z-index: 50;
}
.danmaku-item .danmaku-author {
  font-size: 0.6em;
  color: #D05D1A;
  opacity: 0.55;
  margin-left: 6px;
  font-weight: 400;
}
.danmaku-item .mine-tag {
  font-size: 0.55em;
  background: #F5A623;
  color: #fff;
  padding: 1px 6px;
  border-radius: 8px;
  margin-left: 6px;
  font-weight: 700;
  vertical-align: middle;
}

.copy-toast {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: rgba(208, 93, 26, 0.92);
  color: #FFFDF0;
  padding: 12px 28px;
  border-radius: 12px;
  font-weight: 700; font-size: 1em;
  pointer-events: none;
  opacity: 0; z-index: 999;
  transition: opacity 0.2s, transform 0.2s;
  box-shadow: 0 4px 20px rgba(208, 93, 26, 0.3);
  text-align: center;
  max-width: 80vw;
}
.copy-toast.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.footer {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px;
  background: linear-gradient(90deg, #FFFADC 0%, #FFF5A5 45%, #FFED6B 100%);
  border-top: 2.5px dashed #FFD54F;
  box-shadow: 0 -3px 12px rgba(255, 237, 107, 0.2);
}
.footer-count {
  color: #D05D1A; font-size: 0.85em; font-weight: 700;
  text-shadow: 0 1px 2px rgba(255,255,255,0.6);
}
.btn-submit {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 20px;
  background: linear-gradient(135deg, #F5A623 0%, #E8871E 100%);
  color: #fff; font-weight: 700; font-size: 0.9em;
  border: none; border-radius: 20px; cursor: pointer;
  box-shadow: 0 3px 12px rgba(245, 166, 35, 0.4);
  transition: all 0.2s ease;
  text-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
.btn-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(245, 166, 35, 0.5);
}
.btn-submit-icon {
  width: 20px; height: 20px;
  background: url('https://i.postimg.cc/t482CD77/1773325087190.png') center/contain no-repeat;
  image-rendering: pixelated;
}

.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(208, 93, 26, 0.15);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal {
  background: #FFFDF0;
  border: 2px solid #FFD54F;
  border-radius: 20px;
  padding: 28px 24px;
  width: 90%; max-width: 380px;
  box-shadow: 0 12px 40px rgba(255, 237, 107, 0.3);
  transform: translateY(20px) scale(0.95);
  transition: transform 0.3s cubic-bezier(.34, 1.3, .64, 1);
}
.modal-overlay.active .modal { transform: translateY(0) scale(1); }
.modal-title {
  display: flex; align-items: center; gap: 8px;
  color: #D05D1A; font-weight: 700; font-size: 1.05em;
  margin-bottom: 18px;
}
.modal-title-icon {
  width: 26px; height: 26px;
  background: url('https://i.postimg.cc/44Lbdy7K/1773404738205.png') center/contain no-repeat;
  image-rendering: pixelated;
  animation: wiggle 2.8s ease-in-out infinite;
}
.modal label {
  display: block; color: #D05D1A; font-weight: 700;
  font-size: 0.85em; margin-bottom: 6px; margin-top: 14px;
}
.modal label:first-of-type { margin-top: 0; }
.modal input[type="text"], .modal input[type="password"] {
  width: 100%; padding: 10px 14px;
  border: 1.5px solid rgba(255, 213, 79, 0.55);
  border-radius: 12px;
  background: linear-gradient(180deg, #FFFDF0 0%, #FFF8CC 100%);
  color: #D05D1A; font-size: 1em; font-weight: 700;
  font-family: inherit; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.modal input[type="text"]:focus, .modal input[type="password"]:focus {
  border-color: #F5A623;
  box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15);
}
.modal input::placeholder {
  color: #D05D1A; opacity: 0.3; font-weight: 400;
}
.modal-hint {
  font-size: 0.75em; color: #D05D1A;
  opacity: 0.45; margin-top: 4px;
}
.modal-error {
  font-size: 0.8em; color: #c0392b;
  font-weight: 700;
  margin-top: 8px; min-height: 1em;
}
.author-row { display: flex; align-items: center; gap: 8px; }
.author-row input { flex: 1; }
.btn-clear-name {
  flex-shrink: 0; width: 38px; height: 38px;
  border: 1.5px solid rgba(208, 93, 26, 0.2);
  background: transparent;
  border-radius: 10px;
  color: #D05D1A; cursor: pointer;
  font-size: 0.85em;
  transition: all 0.2s;
}
.btn-clear-name:hover {
  background: rgba(255, 250, 220, 0.6);
  border-color: rgba(208, 93, 26, 0.4);
}
.modal-actions { display: flex; gap: 10px; margin-top: 22px; }
.btn-cancel {
  flex: 1; padding: 10px;
  background: transparent;
  border: 1.5px solid rgba(208, 93, 26, 0.2);
  border-radius: 12px;
  color: #D05D1A; font-weight: 700; font-size: 0.9em;
  cursor: pointer; font-family: inherit;
  transition: all 0.2s;
}
.btn-cancel:hover { background: rgba(255, 250, 220, 0.5); }
.btn-confirm {
  flex: 1.5; padding: 10px;
  background: linear-gradient(135deg, #F5A623 0%, #E8871E 100%);
  border: none; border-radius: 12px;
  color: #fff; font-weight: 700; font-size: 0.9em;
  cursor: pointer; font-family: inherit;
  box-shadow: 0 3px 12px rgba(245, 166, 35, 0.35);
  transition: all 0.2s;
}
.btn-confirm:hover { transform: translateY(-1px); }
.btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }

.tool-btn {
  position: fixed; z-index: 99;
  width: 42px; height: 42px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 213, 79, 0.55);
  background: rgba(255, 253, 240, 0.92);
  color: #D05D1A; font-size: 1em;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(255, 237, 107, 0.3);
  transition: all 0.2s;
}
.tool-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 4px 14px rgba(255, 237, 107, 0.4);
}
.btn-pause { bottom: 76px; right: 16px; }
.btn-list-view { bottom: 76px; right: 68px; }

.list-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(208, 93, 26, 0.1);
  backdrop-filter: blur(4px);
  z-index: 150;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.list-overlay.active { opacity: 1; pointer-events: auto; }
.list-panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 360px; max-width: 90vw;
  background: linear-gradient(180deg, #FFFDF0 0%, #FFF8CC 60%, #FFF5A5 100%);
  border-left: 2px solid #FFD54F;
  box-shadow: -4px 0 20px rgba(255, 237, 107, 0.25);
  z-index: 151;
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(.34, 1.3, .64, 1);
}
.list-overlay.active .list-panel { transform: translateX(0); }
.list-panel-header {
  padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(90deg, #FFFADC 0%, #FFF5A5 45%, #FFED6B 100%);
  border-bottom: 2.5px dashed #FFD54F;
}
.list-panel-title {
  color: #D05D1A; font-weight: 700; font-size: 0.95em;
}
.btn-close-list {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1.5px solid rgba(208, 93, 26, 0.2);
  background: transparent;
  color: #D05D1A; font-size: 1em;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.btn-close-list:hover { background: rgba(255, 250, 220, 0.5); }

/* ★新增：Tab切换★ */
.list-tabs {
  display: flex; gap: 6px;
  padding: 10px 16px 0;
}
.list-tab {
  flex: 1;
  padding: 8px 10px;
  border: none;
  border-radius: 10px 10px 0 0;
  background: rgba(255, 213, 79, 0.2);
  color: #D05D1A;
  font-weight: 700;
  font-size: 0.85em;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  border-bottom: 2.5px solid transparent;
}
.list-tab.active {
  background: rgba(245, 166, 35, 0.15);
  border-bottom-color: #F5A623;
}

.list-panel-content { flex: 1; overflow-y: auto; padding: 12px 16px; }
.list-panel-content::-webkit-scrollbar { width: 6px; }
.list-panel-content::-webkit-scrollbar-track {
  background: rgba(255,245,165,.15);
  border-radius: 3px;
}
.list-panel-content::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #FFED6B 0%, #FFD54F 50%, #FFC107 100%);
  border-radius: 3px;
}
.list-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px;
  border-radius: 12px;
  margin-bottom: 6px;
  background: rgba(255, 253, 240, 0.65);
  border: 1px solid rgba(255, 213, 79, 0.25);
  transition: all 0.15s;
}
.list-item.mine {
  background: rgba(255, 235, 170, 0.55);
  border-color: rgba(245, 166, 35, 0.5);
}
.list-item:hover {
  background: rgba(255, 250, 220, 0.9);
  border-color: rgba(255, 213, 79, 0.5);
}
.list-item-left {
  flex: 1; min-width: 0; cursor: pointer;
  overflow: hidden;
}
.list-item-content {
  color: #D05D1A; font-weight: 700; font-size: 1em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
.list-item-content .content-text {
  overflow: hidden; text-overflow: ellipsis;
}
.list-item-content .mine-tag {
  font-size: 0.7em;
  background: #F5A623;
  color: #fff;
  padding: 1px 6px;
  border-radius: 8px;
  font-weight: 700;
  flex-shrink: 0;
}
.list-item-author {
  color: #D05D1A; opacity: 0.5;
  font-size: 0.7em; font-weight: 400;
  margin-top: 2px;
}
.list-item-actions {
  display: flex; align-items: center; gap: 4px;
  flex-shrink: 0; margin-left: 8px;
}
.btn-copy-mini, .btn-del-mini, .btn-lock-mini {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.95em;
  transition: all 0.15s;
}
.btn-copy-mini {
  background: rgba(245, 166, 35, 0.15);
  color: #D05D1A;
  border: 1.5px solid rgba(245, 166, 35, 0.3);
}
.btn-copy-mini:hover {
  background: rgba(245, 166, 35, 0.3);
  transform: scale(1.1);
}
.btn-del-mini {
  background: rgba(231, 76, 60, 0.12);
  color: #c0392b;
  border: 1.5px solid rgba(231, 76, 60, 0.35);
}
.btn-del-mini:hover {
  background: rgba(231, 76, 60, 0.25);
  transform: scale(1.1);
}
.btn-lock-mini {
  background: rgba(160, 140, 100, 0.1);
  color: #a08c64;
  border: 1.5px solid rgba(160, 140, 100, 0.25);
  opacity: 0.65;
}
.btn-lock-mini:hover {
  background: rgba(160, 140, 100, 0.2);
  opacity: 1;
}

.delete-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(208, 93, 26, 0.2);
  backdrop-filter: blur(4px);
  z-index: 300;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.delete-overlay.active { opacity: 1; pointer-events: auto; }
.delete-modal {
  background: #FFFDF0;
  border: 2px solid #FFD54F;
  border-radius: 20px;
  padding: 24px 22px;
  width: 85%; max-width: 340px;
  box-shadow: 0 12px 40px rgba(255, 237, 107, 0.3);
  transform: translateY(20px) scale(0.95);
  transition: transform 0.3s cubic-bezier(.34, 1.3, .64, 1);
}
.delete-overlay.active .delete-modal { transform: translateY(0) scale(1); }
.delete-modal-title {
  color: #D05D1A; font-weight: 700; font-size: 0.95em;
  margin-bottom: 6px;
}
.delete-modal-preview {
  color: #D05D1A; font-size: 1.3em; font-weight: 700;
  text-align: center; padding: 10px; margin: 10px 0;
  background: rgba(255, 245, 165, 0.3);
  border-radius: 10px;
  word-break: break-all;
}
.delete-modal-owner-note {
  background: rgba(245, 166, 35, 0.12);
  border: 1.5px dashed rgba(245, 166, 35, 0.5);
  border-radius: 10px;
  padding: 10px;
  color: #D05D1A;
  font-size: 0.82em;
  font-weight: 700;
  text-align: center;
  margin: 10px 0 4px;
}
.delete-modal label {
  display: block; color: #D05D1A; font-weight: 700;
  font-size: 0.8em; margin-bottom: 6px; margin-top: 12px;
}
.delete-modal input[type="password"] {
  width: 100%; padding: 9px 12px;
  border: 1.5px solid rgba(255, 213, 79, 0.55);
  border-radius: 10px;
  background: linear-gradient(180deg, #FFFDF0 0%, #FFF8CC 100%);
  color: #D05D1A; font-size: 0.9em;
  font-family: inherit; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.delete-modal input[type="password"]:focus {
  border-color: #F5A623;
  box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15);
}
.delete-modal-actions { display: flex; gap: 10px; margin-top: 18px; }
.btn-delete-cancel {
  flex: 1; padding: 9px;
  background: transparent;
  border: 1.5px solid rgba(208, 93, 26, 0.2);
  border-radius: 10px;
  color: #D05D1A; font-weight: 700; font-size: 0.85em;
  cursor: pointer; font-family: inherit;
  transition: all 0.2s;
}
.btn-delete-cancel:hover { background: rgba(255, 250, 220, 0.5); }
.btn-delete-confirm {
  flex: 1; padding: 9px;
  background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
  border: none; border-radius: 10px;
  color: #fff; font-weight: 700; font-size: 0.85em;
  cursor: pointer; font-family: inherit;
  box-shadow: 0 3px 10px rgba(231, 76, 60, 0.3);
  transition: all 0.2s;
}
.btn-delete-confirm:hover { transform: translateY(-1px); }
.btn-delete-confirm:disabled { opacity: 0.5; cursor: not-allowed; }
.delete-error {
  color: #c0392b; font-size: 0.75em; font-weight: 700;
  margin-top: 6px; min-height: 1em;
}
.empty-tip {
  text-align: center;
  padding: 40px 20px;
  color: #D05D1A;
  opacity: 0.5;
  line-height: 1.8;
}

@media (max-width: 480px) {
  .danmaku-item { font-size: 1em; padding: 5px 12px; }
  .header-title { font-size: 0.95em; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon"></div>
  <div class="header-title">✦ 颜文字收集墙 ✦</div>
  <div class="header-toast"></div>
</div>

<div class="danmaku-stage" id="stage"></div>

<div class="copy-toast" id="copyToast">已复制！ (ᐢ..ᐢ)✧</div>

<button class="tool-btn btn-pause" id="btnPause" title="暂停/继续">⏸</button>
<button class="tool-btn btn-list-view" id="btnListView" title="列表">☰</button>

<div class="footer">
  <div class="footer-count" id="footerCount">收集中...</div>
  <button class="btn-submit" id="btnSubmit">
    <span class="btn-submit-icon"></span>
    投个颜文字！
  </button>
</div>

<!-- 投稿弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title">
      <div class="modal-title-icon"></div>
      投稿颜文字！
    </div>
    <label for="inputKaomoji">你的颜文字</label>
    <input type="text" id="inputKaomoji" placeholder="(｡･ω･｡)" maxlength="100" autocomplete="off">
    <div class="modal-hint">100字符以内～ 重复的会被拒收哦</div>
    <label for="inputAuthor">你的名字（选填）</label>
    <div class="author-row">
      <input type="text" id="inputAuthor" placeholder="不填就匿名啦～" maxlength="20" autocomplete="off">
      <button type="button" class="btn-clear-name" id="btnClearName" title="清除保存的名字">✕</button>
    </div>
    <div class="modal-hint">会记住你的名字哦～点✕清除</div>
    <div class="modal-error" id="modalError"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancel">算了</button>
      <button class="btn-confirm" id="btnConfirm">发射！</button>
    </div>
  </div>
</div>

<!-- 列表抽屉 -->
<div class="list-overlay" id="listOverlay">
  <div class="list-panel">
    <div class="list-panel-header">
      <div class="list-panel-title" id="listPanelTitle">全部颜文字 · 📋复制 / 🗑删除</div>
      <button class="btn-close-list" id="btnCloseList">✕</button>
    </div>
    <div class="list-tabs">
      <button class="list-tab active" data-tab="all">全部</button>
      <button class="list-tab" data-tab="mine">我的投稿</button>
    </div>
    <div class="list-panel-content" id="listContent"></div>
  </div>
</div>

<!-- 删除确认 -->
<div class="delete-overlay" id="deleteOverlay">
  <div class="delete-modal">
    <div class="delete-modal-title" id="deleteModalTitle">确定要删除这个颜文字吗？</div>
    <div class="delete-modal-preview" id="deletePreview"></div>
    <div id="deleteOwnerNote" class="delete-modal-owner-note" style="display:none;">
      这是你自己投的颜文字～ 不用密码直接删！ (ᐢ..ᐢ)
    </div>
    <div id="deletePasswordWrap">
      <label for="deletePassword">管理密码</label>
      <input type="password" id="deletePassword" placeholder="输入管理密码" autocomplete="off">
    </div>
    <div class="delete-error" id="deleteError"></div>
    <div class="delete-modal-actions">
      <button class="btn-delete-cancel" id="btnDeleteCancel">算了</button>
      <button class="btn-delete-confirm" id="btnDeleteConfirm">删除</button>
    </div>
  </div>
</div>

<script>
(function() {
  // ============== DOM refs ==============
  const stage = document.getElementById('stage');
  const copyToast = document.getElementById('copyToast');
  const footerCount = document.getElementById('footerCount');
  const btnSubmit = document.getElementById('btnSubmit');
  const btnPause = document.getElementById('btnPause');
  const btnListView = document.getElementById('btnListView');
  const modalOverlay = document.getElementById('modalOverlay');
  const inputKaomoji = document.getElementById('inputKaomoji');
  const inputAuthor = document.getElementById('inputAuthor');
  const btnClearName = document.getElementById('btnClearName');
  const btnCancel = document.getElementById('btnCancel');
  const btnConfirm = document.getElementById('btnConfirm');
  const modalError = document.getElementById('modalError');
  const listOverlay = document.getElementById('listOverlay');
  const listContent = document.getElementById('listContent');
  const listPanelTitle = document.getElementById('listPanelTitle');
  const btnCloseList = document.getElementById('btnCloseList');
  const listTabs = document.querySelectorAll('.list-tab');
  const deleteOverlay = document.getElementById('deleteOverlay');
  const deleteModalTitle = document.getElementById('deleteModalTitle');
  const deletePreview = document.getElementById('deletePreview');
  const deletePassword = document.getElementById('deletePassword');
  const deleteError = document.getElementById('deleteError');
  const deleteOwnerNote = document.getElementById('deleteOwnerNote');
  const deletePasswordWrap = document.getElementById('deletePasswordWrap');
  const btnDeleteCancel = document.getElementById('btnDeleteCancel');
  const btnDeleteConfirm = document.getElementById('btnDeleteConfirm');

  const STORAGE_KEY_NAME = 'kaomoji_wall_author';
  const STORAGE_KEY_TOKENS = 'kaomoji_wall_my_tokens';

  // ============== 本地token管理（自己投稿的凭证） ==============
  function getMyTokens() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY_TOKENS) || '{}'); }
    catch { return {}; }
  }
  function saveMyToken(id, token) {
    const m = getMyTokens();
    m[id] = token;
    localStorage.setItem(STORAGE_KEY_TOKENS, JSON.stringify(m));
  }
  function removeMyToken(id) {
    const m = getMyTokens();
    delete m[id];
    localStorage.setItem(STORAGE_KEY_TOKENS, JSON.stringify(m));
  }
  function isMine(id) {
    return !!getMyTokens()[id];
  }

  // ============== 弹幕引擎配置 ==============
  const CONFIG = {
    MAX_ACTIVE: 12,
    SPAWN_INTERVAL: 1200,
    MIN_SPEED: 60,
    MAX_SPEED: 140,
    ITEM_HEIGHT: 46,
    LANE_GAP: 8,
    STAGE_PADDING: 12,
    LANE_COOLDOWN: 600,
  };

  let allKaomoji = [];
  let activeDanmaku = [];
  let isPaused = false;
  let rafId = null;
  let lastFrameTime = 0;
  let lastSpawnTime = 0;
  let laneCooldown = [];
  let deleteTargetItem = null;
  let currentTab = 'all';

  async function loadData() {
    try {
      const res = await fetch('/api/kaomoji');
      allKaomoji = await res.json();
      updateCount();
      startEngine();
    } catch (e) {
      footerCount.textContent = '加载失败了… (╥﹏╥)';
    }
  }

  function updateCount() {
    const myCount = allKaomoji.filter(k => isMine(k.id)).length;
    let txt = '已收集 ' + allKaomoji.length + ' 个颜文字 ✦';
    if (myCount > 0) txt += '  (我的 ' + myCount + ')';
    footerCount.textContent = txt;
  }

  function getLaneCount() {
    const stageH = stage.offsetHeight;
    return Math.max(1, Math.floor((stageH - CONFIG.STAGE_PADDING * 2) / (CONFIG.ITEM_HEIGHT + CONFIG.LANE_GAP)));
  }

  function pickLane(now) {
    const laneCount = getLaneCount();
    while (laneCooldown.length < laneCount) laneCooldown.push(0);
    if (laneCooldown.length > laneCount) laneCooldown.length = laneCount;
    const available = [];
    for (let i = 0; i < laneCount; i++) {
      if (laneCooldown[i] <= now) available.push(i);
    }
    if (available.length === 0) return -1;
    return available[Math.floor(Math.random() * available.length)];
  }

  function spawnDanmaku(item, now) {
    if (activeDanmaku.length >= CONFIG.MAX_ACTIVE) return false;

    const lane = pickLane(now);
    if (lane === -1) return false;

    const mine = isMine(item.id);

    const el = document.createElement('div');
    el.className = 'danmaku-item' + (mine ? ' mine' : '');
    let html = escapeHtml(item.content);
    if (item.author) {
      html += '<span class="danmaku-author">— ' + escapeHtml(item.author) + '</span>';
    }
    if (mine) {
      html += '<span class="mine-tag">我的</span>';
    }
    el.innerHTML = html;

    const scale = 0.95 + Math.random() * 0.25;
    el.style.fontSize = scale + 'em';

    const top = CONFIG.STAGE_PADDING + lane * (CONFIG.ITEM_HEIGHT + CONFIG.LANE_GAP);
    el.style.top = top + 'px';

    const stageW = stage.offsetWidth;
    el.style.transform = 'translate3d(' + stageW + 'px, 0, 0)';

    stage.appendChild(el);

    const width = el.offsetWidth;
    const speed = CONFIG.MIN_SPEED + Math.random() * (CONFIG.MAX_SPEED - CONFIG.MIN_SPEED);

    const danmaku = {
      el: el,
      x: stageW,
      width: width,
      lane: lane,
      speed: speed,
      item: item,
      pressed: false,
    };

    activeDanmaku.push(danmaku);

    const entryMs = (width / speed) * 1000 + 200;
    laneCooldown[lane] = now + Math.max(CONFIG.LANE_COOLDOWN, entryMs);

    bindDanmakuClick(danmaku);

    return true;
  }

  function bindDanmakuClick(danmaku) {
    const el = danmaku.el;
    const onPress = function(e) {
      if (danmaku.pressed) return;
      danmaku.pressed = true;
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();

      el.classList.add('flash');
      copyToClipboard(danmaku.item.content);

      setTimeout(function() {
        if (el.parentNode) el.classList.remove('flash');
        danmaku.pressed = false;
      }, 350);
    };

    if (window.PointerEvent) {
      el.addEventListener('pointerdown', onPress);
    } else {
      el.addEventListener('touchstart', onPress, { passive: false });
      el.addEventListener('mousedown', onPress);
    }
  }

  function tick(timestamp) {
    if (!lastFrameTime) lastFrameTime = timestamp;
    const dt = Math.min(timestamp - lastFrameTime, 100);
    lastFrameTime = timestamp;

    if (!isPaused) {
      for (let i = activeDanmaku.length - 1; i >= 0; i--) {
        const d = activeDanmaku[i];
        if (!d.pressed) {
          d.x -= d.speed * (dt / 1000);
        }
        d.el.style.transform = 'translate3d(' + d.x + 'px, 0, 0)';

        if (d.x + d.width < -20) {
          d.el.remove();
          activeDanmaku.splice(i, 1);
        }
      }

      if (timestamp - lastSpawnTime > CONFIG.SPAWN_INTERVAL && allKaomoji.length > 0) {
        const item = allKaomoji[Math.floor(Math.random() * allKaomoji.length)];
        if (spawnDanmaku(item, timestamp)) {
          lastSpawnTime = timestamp;
        } else {
          lastSpawnTime = timestamp - CONFIG.SPAWN_INTERVAL + 300;
        }
      }
    }

    rafId = requestAnimationFrame(tick);
  }

  function startEngine() {
    if (rafId !== null) return;
    lastFrameTime = 0;
    lastSpawnTime = 0;
    rafId = requestAnimationFrame(tick);
  }

  function stopEngine() {
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  function clearAllDanmaku() {
    activeDanmaku.forEach(function(d) { d.el.remove(); });
    activeDanmaku = [];
    laneCooldown = [];
  }

  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      stopEngine();
    } else {
      clearAllDanmaku();
      startEngine();
    }
  });

  let resizeTimer = null;
  window.addEventListener('resize', function() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      clearAllDanmaku();
    }, 200);
  });

  btnPause.addEventListener('click', function() {
    isPaused = !isPaused;
    btnPause.textContent = isPaused ? '▶' : '⏸';
  });

  // ============== 复制 ==============
  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext !== false) {
      navigator.clipboard.writeText(text).then(function(){ showCopyToast('已复制！ (ᐢ..ᐢ)✧'); }).catch(function() {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    showCopyToast(ok ? '已复制！ (ᐢ..ᐢ)✧' : '复制失败 orz');
  }
  let copyToastTimer = null;
  function showCopyToast(msg) {
    copyToast.textContent = msg || '已复制！ (ᐢ..ᐢ)✧';
    copyToast.classList.add('show');
    if (copyToastTimer) clearTimeout(copyToastTimer);
    copyToastTimer = setTimeout(function() {
      copyToast.classList.remove('show');
    }, 1500);
  }

  // ============== 投稿 ==============
  btnSubmit.addEventListener('click', function() {
    modalOverlay.classList.add('active');
    inputKaomoji.value = '';
    modalError.textContent = '';
    const savedName = localStorage.getItem(STORAGE_KEY_NAME) || '';
    inputAuthor.value = savedName;
    setTimeout(function() { inputKaomoji.focus(); }, 300);
  });
  btnClearName.addEventListener('click', function() {
    inputAuthor.value = '';
    localStorage.removeItem(STORAGE_KEY_NAME);
    inputAuthor.focus();
  });
  btnCancel.addEventListener('click', function() {
    modalOverlay.classList.remove('active');
  });
  modalOverlay.addEventListener('click', function(e) {
    if (e.target === modalOverlay) modalOverlay.classList.remove('active');
  });
  btnConfirm.addEventListener('click', submitKaomoji);
  inputKaomoji.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submitKaomoji();
  });
  inputAuthor.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submitKaomoji();
  });
  inputKaomoji.addEventListener('input', function(){ modalError.textContent = ''; });

  async function submitKaomoji() {
    const content = inputKaomoji.value.trim();
    if (!content) {
      modalError.textContent = '写点啥嘛～';
      inputKaomoji.focus();
      return;
    }
    const authorName = inputAuthor.value.trim();
    btnConfirm.disabled = true;
    btnConfirm.textContent = '发射中...';
    modalError.textContent = '';
    try {
      const res = await fetch('/api/kaomoji', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: content, author: authorName })
      });
      const data = await res.json();
      if (!res.ok) {
        modalError.textContent = data.error || '发射失败了 (╥﹏╥)';
        return;
      }
      // 保存自己的token
      if (data.delete_token) saveMyToken(data.id, data.delete_token);
      const newItem = {
        id: data.id,
        content: data.content,
        author: data.author,
        created_at: data.created_at
      };
      allKaomoji.unshift(newItem);
      updateCount();
      if (authorName) {
        localStorage.setItem(STORAGE_KEY_NAME, authorName);
      }
      modalOverlay.classList.remove('active');
      // 刚投的立刻派出去
      setTimeout(function() {
        spawnDanmaku(newItem, performance.now());
      }, 100);
    } catch (e) {
      modalError.textContent = '网络出错了 (╥﹏╥)';
    } finally {
      btnConfirm.disabled = false;
      btnConfirm.textContent = '发射！';
    }
  }

  // ============== 列表 ==============
  btnListView.addEventListener('click', function() {
    renderList();
    listOverlay.classList.add('active');
  });
  btnCloseList.addEventListener('click', function() {
    listOverlay.classList.remove('active');
  });
  listOverlay.addEventListener('click', function(e) {
    if (e.target === listOverlay) listOverlay.classList.remove('active');
  });

  listTabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      listTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      renderList();
    });
  });

  function renderList() {
    listContent.innerHTML = '';
    let list = allKaomoji;
    if (currentTab === 'mine') {
      list = allKaomoji.filter(k => isMine(k.id));
      listPanelTitle.textContent = '我的投稿 · 可直接删除';
      if (list.length === 0) {
        listContent.innerHTML = '<div class="empty-tip">你还没投过颜文字～<br>去底部"投个颜文字！"试试吧 (ᐢ..ᐢ)</div>';
        return;
      }
    } else {
      listPanelTitle.textContent = '全部颜文字 · 📋复制 / 🗑删除';
      if (list.length === 0) {
        listContent.innerHTML = '<div class="empty-tip">还没有颜文字哦～</div>';
        return;
      }
    }
    list.forEach(function(item) {
      const mine = isMine(item.id);
      const el = document.createElement('div');
      el.className = 'list-item' + (mine ? ' mine' : '');
      const mineTag = mine ? '<span class="mine-tag">我的</span>' : '';
      const delBtn = mine
        ? '<button class="btn-del-mini" title="删除我的">🗑</button>'
        : '<button class="btn-lock-mini" title="管理员删除">🔒</button>';
      el.innerHTML =
        '<div class="list-item-left">' +
          '<div class="list-item-content"><span class="content-text">' + escapeHtml(item.content) + '</span>' + mineTag + '</div>' +
          (item.author ? '<div class="list-item-author">— ' + escapeHtml(item.author) + '</div>' : '') +
        '</div>' +
        '<div class="list-item-actions">' +
          '<button class="btn-copy-mini" title="复制">📋</button>' +
          delBtn +
        '</div>';
      el.querySelector('.list-item-left').addEventListener('click', function() {
        copyToClipboard(item.content);
      });
      el.querySelector('.btn-copy-mini').addEventListener('click', function(e) {
        e.stopPropagation();
        copyToClipboard(item.content);
      });
      const delEl = el.querySelector('.btn-del-mini') || el.querySelector('.btn-lock-mini');
      if (delEl) {
        delEl.addEventListener('click', function(e) {
          e.stopPropagation();
          openDeleteModal(item);
        });
      }
      listContent.appendChild(el);
    });
  }

  // ============== 删除 ==============
  function openDeleteModal(item) {
    deleteTargetItem = item;
    deletePreview.textContent = item.content;
    deletePassword.value = '';
    deleteError.textContent = '';

    if (isMine(item.id)) {
      // 自己的，不要密码
      deleteModalTitle.textContent = '删除你投稿的颜文字？';
      deleteOwnerNote.style.display = 'block';
      deletePasswordWrap.style.display = 'none';
    } else {
      // 别人的，要管理员密码
      deleteModalTitle.textContent = '确定要删除这个颜文字吗？';
      deleteOwnerNote.style.display = 'none';
      deletePasswordWrap.style.display = 'block';
    }

    deleteOverlay.classList.add('active');
    setTimeout(function() {
      if (!isMine(item.id)) deletePassword.focus();
    }, 300);
  }
  btnDeleteCancel.addEventListener('click', function() {
    deleteOverlay.classList.remove('active');
    deleteTargetItem = null;
  });
  deleteOverlay.addEventListener('click', function(e) {
    if (e.target === deleteOverlay) {
      deleteOverlay.classList.remove('active');
      deleteTargetItem = null;
    }
  });
  deletePassword.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doDelete();
  });
  btnDeleteConfirm.addEventListener('click', doDelete);

  async function doDelete() {
    if (!deleteTargetItem) return;
    const id = deleteTargetItem.id;
    const mine = isMine(id);

    let body;
    if (mine) {
      const token = getMyTokens()[id];
      if (!token) { deleteError.textContent = '找不到凭证了…'; return; }
      body = { token: token };
    } else {
      const pw = deletePassword.value;
      if (!pw) { deleteError.textContent = '请输入管理密码～'; return; }
      body = { password: pw };
    }

    btnDeleteConfirm.disabled = true;
    btnDeleteConfirm.textContent = '删除中...';
    deleteError.textContent = '';
    try {
      const res = await fetch('/api/kaomoji/' + id, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) {
        deleteError.textContent = data.error || '删除失败了';
        return;
      }
      allKaomoji = allKaomoji.filter(function(k) { return k.id !== id; });
      if (mine) removeMyToken(id);
      updateCount();
      deleteOverlay.classList.remove('active');
      deleteTargetItem = null;
      renderList();
    } catch (e) {
      deleteError.textContent = '网络出错了…';
    } finally {
      btnDeleteConfirm.disabled = false;
      btnDeleteConfirm.textContent = '删除';
    }
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  loadData();
})();
</script>

</body>
</html>
