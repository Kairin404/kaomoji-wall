<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ 颜文字收集墙 ✦</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #ffeaf4 0%, #e8f0ff 50%, #f0e8ff 100%);
    color: #4a3a5a;
    position: relative;
  }

  /* ===== 顶部栏 ===== */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.6);
  }
  .title { font-size: 20px; font-weight: 700; color: #b56cac; letter-spacing: 1px; }
  .topbar-btns { display: flex; gap: 8px; }
  .icon-btn {
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(181,108,172,0.25);
    border-radius: 12px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 14px;
    color: #7a5a8a;
    transition: all 0.2s;
  }
  .icon-btn:hover { background: #fff; transform: translateY(-1px); }
  .icon-btn.pause.paused { background: #ffd6e7; color: #b56cac; }

  /* ===== 弹幕区 ===== */
  #danmu-area {
    position: fixed;
    top: 60px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .danmu {
    position: absolute;
    white-space: nowrap;
    font-size: 22px;
    padding: 6px 16px;
    border-radius: 18px;
    background: rgba(255,255,255,0.75);
    border: 1px solid rgba(181,108,172,0.18);
    box-shadow: 0 2px 8px rgba(181,108,172,0.08);
    cursor: pointer;
    pointer-events: auto;
    will-change: transform;
    /* 从屏幕右外 → 屏幕左外 */
    animation-name: danmu-fly;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  .danmu .author {
    font-size: 12px;
    color: #b56cac;
    margin-left: 8px;
    opacity: 0.7;
  }
  .danmu:hover { background: #fff; }
  .danmu.paused { animation-play-state: paused; }

  @keyframes danmu-fly {
    from { transform: translateX(100vw); }
    to   { transform: translateX(calc(-100vw - 100%)); }
  }

  /* ===== 角落投稿按钮 ===== */
  .fab {
    position: fixed; right: 24px; bottom: 24px; z-index: 90;
    padding: 14px 22px;
    background: linear-gradient(135deg, #ffb6d9, #c9a8ff);
    color: #fff;
    border: none; border-radius: 30px;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(181,108,172,0.35);
    transition: transform 0.2s;
  }
  .fab:hover { transform: translateY(-2px) scale(1.03); }

  /* ===== 弹窗 ===== */
  .mask {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(90,60,100,0.35);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center; justify-content: center;
  }
  .mask.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 20px;
    padding: 24px;
    width: 92%; max-width: 460px;
    max-height: 82vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(90,60,100,0.3);
    position: relative;
  }
  .modal h2 {
    font-size: 18px; color: #b56cac;
    margin-bottom: 16px;
    padding-right: 28px;
  }
  .close-x {
    position: absolute; right: 14px; top: 14px;
    width: 28px; height: 28px; border-radius: 50%;
    border: none; background: #f5eaf2; color: #b56cac;
    cursor: pointer; font-size: 14px;
  }
  .close-x:hover { background: #ffd6e7; }

  .input, .textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid #e8d5e5;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
    background: #fafafa;
  }
  .input:focus, .textarea:focus { border-color: #b56cac; background: #fff; }
  .textarea { resize: none; min-height: 60px; }
  .hint { font-size: 12px; color: #a090a8; margin: 6px 2px; }
  .field { margin-bottom: 14px; }

  .btn-row { display: flex; gap: 10px; margin-top: 8px; }
  .btn {
    flex: 1;
    padding: 10px;
    border: none; border-radius: 12px;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn.primary {
    background: linear-gradient(135deg, #ffb6d9, #c9a8ff);
    color: #fff;
  }
  .btn.primary:hover { transform: translateY(-1px); }
  .btn.ghost {
    background: #f5eaf2; color: #7a5a8a;
  }
  .btn.danger {
    background: #ffb6b6; color: #fff;
  }

  /* 列表 */
  .list-wrap {
    overflow-y: auto;
    max-height: 60vh;
    margin: 0 -8px;
    padding: 0 8px;
  }
  .list-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    margin-bottom: 8px;
    background: #fafafa;
    border: 1px solid #f0e5ed;
    transition: background 0.15s;
  }
  .list-item:hover { background: #fff6fb; }
  .li-content { flex: 1; font-size: 16px; word-break: break-all; }
  .li-author { font-size: 11px; color: #b56cac; opacity: 0.7; }
  .li-btn {
    border: none; background: transparent;
    cursor: pointer; font-size: 16px;
    padding: 4px 8px; border-radius: 8px;
    transition: background 0.15s;
  }
  .li-btn:hover { background: #ffd6e7; }

  /* 提示 toast */
  #toast {
    position: fixed; top: 80px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(80,50,90,0.9);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 999;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">✦ 颜文字收集墙 ✦</div>
  <div class="topbar-btns">
    <button class="icon-btn pause" id="btn-pause" title="暂停/继续">⏸ 暂停</button>
    <button class="icon-btn" id="btn-list" title="查看全部">☰ 列表</button>
  </div>
</div>

<div id="danmu-area"></div>

<button class="fab" id="btn-submit">投个颜文字！ (ᐢ..ᐢ)</button>

<!-- 投稿弹窗 -->
<div class="mask" id="mask-submit">
  <div class="modal">
    <button class="close-x" onclick="closeMask('mask-submit')">✕</button>
    <h2>投稿颜文字！</h2>
    <div class="field">
      <textarea class="textarea" id="in-content" placeholder="你的颜文字 (◕ᴗ◕✿)" maxlength="100"></textarea>
      <div class="hint">100字符以内～</div>
    </div>
    <div class="field">
      <input class="input" id="in-author" placeholder="你的名字（选填）" maxlength="20">
      <div class="hint">会记住你的名字哦～ 留空即匿名</div>
    </div>
    <div class="btn-row">
      <button class="btn ghost" onclick="closeMask('mask-submit')">算了</button>
      <button class="btn primary" onclick="submitKaomoji()">发射！</button>
    </div>
  </div>
</div>

<!-- 列表弹窗 -->
<div class="mask" id="mask-list">
  <div class="modal">
    <button class="close-x" onclick="closeMask('mask-list')">✕</button>
    <h2>全部颜文字 · 点 📋 复制 / 🗑 删除</h2>
    <div class="list-wrap" id="list-wrap"></div>
  </div>
</div>

<!-- 删除确认 -->
<div class="mask" id="mask-delete">
  <div class="modal">
    <button class="close-x" onclick="closeMask('mask-delete')">✕</button>
    <h2>确定要删除这个颜文字吗？</h2>
    <div class="field">
      <div id="del-preview" style="font-size:20px;padding:10px;background:#fafafa;border-radius:12px;text-align:center;margin-bottom:12px;"></div>
      <input class="input" id="in-password" type="password" placeholder="管理密码">
    </div>
    <div class="btn-row">
      <button class="btn ghost" onclick="closeMask('mask-delete')">算了</button>
      <button class="btn danger" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let allKaomoji = [];
let deleteTargetId = null;
let paused = false;

// ===== 工具 =====
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}
function openMask(id) { document.getElementById(id).classList.add('show'); }
function closeMask(id) { document.getElementById(id).classList.remove('show'); }

// 复制（兼容非HTTPS降级）
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* 降级 */ }
  // execCommand 降级方案
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '-1000px';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}

// ===== API =====
async function fetchAll() {
  try {
    const res = await fetch('/api/kaomoji');
    allKaomoji = await res.json();
    startDanmu();
  } catch (e) { toast('加载失败QwQ'); }
}

async function submitKaomoji() {
  const content = document.getElementById('in-content').value.trim();
  const author = document.getElementById('in-author').value.trim();
  if (!content) { toast('写点啥嘛～'); return; }
  try {
    const res = await fetch('/api/kaomoji', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, author })
    });
    const data = await res.json();
    if (!res.ok) { toast(data.error || '投稿失败'); return; }
    allKaomoji.unshift(data);
    document.getElementById('in-content').value = '';
    // 名字保留（老大贴心需求）
    closeMask('mask-submit');
    toast('已发射！✧');
    shootDanmu(data); // 立刻放一条出来
  } catch (e) { toast('网络错误'); }
}

function openDeleteConfirm(id) {
  const k = allKaomoji.find(x => x.id === id);
  if (!k) return;
  deleteTargetId = id;
  document.getElementById('del-preview').textContent = k.content;
  document.getElementById('in-password').value = '';
  openMask('mask-delete');
}

async function confirmDelete() {
  const password = document.getElementById('in-password').value;
  if (!password) { toast('要输密码哦'); return; }
  try {
    const res = await fetch('/api/kaomoji/' + deleteTargetId, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    const data = await res.json();
    if (!res.ok) { toast(data.error || '删除失败'); return; }
    allKaomoji = allKaomoji.filter(x => x.id !== deleteTargetId);
    closeMask('mask-delete');
    renderList();
    toast('删掉啦～');
  } catch (e) { toast('网络错误'); }
}

// ===== 弹幕 =====
const area = document.getElementById('danmu-area');
const LANES = 8; // 行道数
const laneUsedUntil = new Array(LANES).fill(0); // 每条道上一条弹幕结束时间戳

function pickLane() {
  const now = Date.now();
  // 找最早空出来的道
  let best = 0;
  for (let i = 1; i < LANES; i++) {
    if (laneUsedUntil[i] < laneUsedUntil[best]) best = i;
  }
  return best;
}

function shootDanmu(k) {
  const lane = pickLane();
  const el = document.createElement('div');
  el.className = 'danmu';
  el.innerHTML = '<span>' + escapeHtml(k.content) + '</span>' +
                 (k.author ? '<span class="author">— ' + escapeHtml(k.author) + '</span>' : '');
  // 随机速度
  const duration = 10 + Math.random() * 6; // 10~16秒
  el.style.animationDuration = duration + 's';

  // 行道位置
  const laneHeight = (area.clientHeight - 20) / LANES;
  el.style.top = (lane * laneHeight + 10) + 'px';

  // 字体大小随机
  el.style.fontSize = (18 + Math.random() * 10) + 'px';

  // 点击复制
  el.addEventListener('click', async () => {
    const ok = await copyText(k.content);
    toast(ok ? '已复制！ (ᐢ..ᐢ)✧' : '复制失败 orz');
  });

  // 暂停状态下新出来的也暂停
  if (paused) el.classList.add('paused');

  // 动画结束自动移除
  el.addEventListener('animationend', () => el.remove());

  area.appendChild(el);

  // 标记该道占用到何时（防止追尾）
  // 弹幕宽度出现在屏幕上约前 3 秒完成入场
  laneUsedUntil[lane] = Date.now() + 3000;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

let danmuTimer = null;
function startDanmu() {
  if (danmuTimer) clearInterval(danmuTimer);
  if (!allKaomoji.length) return;
  let idx = 0;
  // 先放几条进场
  for (let i = 0; i < Math.min(4, allKaomoji.length); i++) {
    setTimeout(() => shootDanmu(allKaomoji[i % allKaomoji.length]), i * 600);
  }
  idx = 4;
  danmuTimer = setInterval(() => {
    if (paused) return;
    if (!allKaomoji.length) return;
    shootDanmu(allKaomoji[idx % allKaomoji.length]);
    idx++;
  }, 1400);
}

// ===== 列表 =====
function renderList() {
  const wrap = document.getElementById('list-wrap');
  if (!allKaomoji.length) {
    wrap.innerHTML = '<div style="text-align:center;padding:30px;color:#b0a0b8">还没有颜文字呀～</div>';
    return;
  }
  wrap.innerHTML = allKaomoji.map(k => `
    <div class="list-item">
      <div>
        <div class="li-content">${escapeHtml(k.content)}</div>
        ${k.author ? `<div class="li-author">— ${escapeHtml(k.author)}</div>` : ''}
      </div>
      <button class="li-btn" title="复制" onclick="copyFromList(${k.id})">📋</button>
      <button class="li-btn" title="删除" onclick="openDeleteConfirm(${k.id})">🗑</button>
    </div>
  `).join('');
}

async function copyFromList(id) {
  const k = allKaomoji.find(x => x.id === id);
  if (!k) return;
  const ok = await copyText(k.content);
  toast(ok ? '已复制！ (ᐢ..ᐢ)✧' : '复制失败 orz');
}

// ===== 事件 =====
document.getElementById('btn-submit').onclick = () => openMask('mask-submit');
document.getElementById('btn-list').onclick = () => { renderList(); openMask('mask-list'); };
document.getElementById('btn-pause').onclick = (e) => {
  paused = !paused;
  document.querySelectorAll('.danmu').forEach(el => el.classList.toggle('paused', paused));
  e.currentTarget.classList.toggle('paused', paused);
  e.currentTarget.textContent = paused ? '▶ 继续' : '⏸ 暂停';
};

// 关掉遮罩（点外部）
document.querySelectorAll('.mask').forEach(m => {
  m.addEventListener('click', (e) => {
    if (e.target === m) m.classList.remove('show');
  });
});

// 启动！
fetchAll();
</script>
</body>
</html>
