<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>颜文字收集墙 ～ (｡･ω･｡)</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}

body {
  background: linear-gradient(180deg, #FFFDF0 0%, #FFF8CC 40%, #FFF5A5 100%);
  min-height: 100vh;
  overflow: hidden;
  font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  position: relative;
}

/*====== 顶部标题栏 ====== */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px 20px;
  background: linear-gradient(90deg, #FFFADC 0%, #FFF5A5 45%, #FFED6B 100%);
  border-bottom: 2.5px dashed #FFD54F;
  box-shadow: 0 3px 12px rgba(255, 237, 107, 0.25);
}

.header-icon {
  width: 32px; height: 32px;
  background: url('https://i.postimg.cc/44Lbdy7K/1773404738205.png') center/contain no-repeat;
  image-rendering: pixelated;
  animation: wiggle 2.8s ease-in-out infinite;
  filter: drop-shadow(0 2px 4px rgba(255,213,79,.35));
}

@keyframes wiggle {
  0%,100%{transform:translateX(0) translateY(0) rotate(0deg)}
  8%{transform:translateX(-2px) translateY(-1px) rotate(-6deg)}
  16%{transform:translateX(0) translateY(-3px) rotate(0deg)}
  24%{transform:translateX(2px) translateY(-1px) rotate(6deg)}
  32%{transform:translateX(0) translateY(0) rotate(0deg)}
  50%{transform:translateX(0) translateY(-4px) rotate(2deg)}
  75%{transform:translateX(0) translateY(0) rotate(0deg)}
}

.header-title {
  color: #D05D1A;
  font-weight: 700;
  font-size: 1.1em;
  text-shadow: 0 1px 2px rgba(255,255,255,0.6);
  letter-spacing: 1px;
}

.header-toast {
  width: 32px; height: 32px;
  background: url('https://i.postimg.cc/t482CD77/1773325087190.png') center/contain no-repeat;
  image-rendering: pixelated;
  animation: toastBounce 3.2s ease-in-out infinite;
  filter: drop-shadow(0 2px 4px rgba(255,213,79,.35));
}

@keyframes toastBounce {
  0%{transform:translateY(0) rotate(0deg) scale(1,1)}
  5%{transform:translateY(1px) rotate(0deg) scale(1.02,0.97)}
  14%{transform:translateY(-8px) rotate(4deg) scale(0.96,1.06)}
  26%{transform:translateY(0) rotate(0deg) scale(1.08,0.92)}
  36%{transform:translateY(-4px) rotate(-2deg) scale(0.98,1.03)}
  42%{transform:translateY(0) rotate(0deg) scale(1.04,0.95)}
  52%,100%{transform:translateY(0) rotate(0deg) scale(1,1)}
}

/* ====== 弹幕区域 ====== */
.danmaku-stage {
  position: fixed;
  top: 60px; left: 0; right: 0; bottom: 80px;
  overflow: hidden;
  pointer-events: none;
}

/*====== 单条弹幕 ====== */
.danmaku-item {
  position: absolute;
  white-space: nowrap;
  pointer-events: auto;
  cursor: pointer;
  padding: 6px 16px;
  border-radius: 20px;
  background: rgba(255, 253, 240, 0.88);
  border: 1.5px solid rgba(255, 213, 79, 0.45);
  box-shadow: 0 2px 8px rgba(255, 237, 107, 0.25);
  color: #D05D1A;
  font-weight: 700;
  font-size: 1.2em;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  user-select: none;
  will-change: transform;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}

.danmaku-item:hover {
  transform: scale(1.12) !important;
  box-shadow: 0 4px 16px rgba(255, 237, 107, 0.45);
  background: rgba(255, 250, 220, 0.95);
  z-index: 50;
}

.danmaku-item .danmaku-author {
  font-size: 0.6em;
  color: #D05D1A;
  opacity: 0.55;
  margin-left: 6px;
  font-weight: 400;
}

/*复制反馈 */
.copy-toast {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: rgba(208, 93, 26, 0.92);
  color: #FFFDF0;
  padding: 12px 28px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 1em;
  pointer-events: none;
  opacity: 0;
  z-index: 999;
  transition: opacity 0.2s, transform 0.2s;
  box-shadow: 0 4px 20px rgba(208, 93, 26, 0.3);
}

.copy-toast.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* ====== 底部栏 ====== */
.footer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: linear-gradient(90deg, #FFFADC 0%, #FFF5A5 45%, #FFED6B 100%);
  border-top: 2.5px dashed #FFD54F;
  box-shadow: 0 -3px 12px rgba(255, 237, 107, 0.2);
}

.footer-count {
  color: #D05D1A;
  font-size: 0.85em;
  font-weight: 700;
  text-shadow: 0 1px 2px rgba(255,255,255,0.6);
}

.btn-submit {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 20px;
  background: linear-gradient(135deg, #F5A623 0%, #E8871E 100%);
  color: #fff;
  font-weight: 700;
  font-size: 0.9em;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  box-shadow: 0 3px 12px rgba(245, 166, 35, 0.4);
  transition: all 0.2s ease;
  text-shadow: 0 1px 2px rgba(0,0,0,0.15);
}

.btn-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(245, 166, 35, 0.5);
  background: linear-gradient(135deg, #FBBD40 0%, #F5A623 100%);
}

.btn-submit:active {
  transform: translateY(0);
}

.btn-submit-icon {
  width: 20px; height: 20px;
  background: url('https://i.postimg.cc/t482CD77/1773325087190.png') center/contain no-repeat;
  image-rendering: pixelated;
}

/* ====== 投稿弹窗 ====== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(208, 93, 26, 0.15);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal {
  background: #FFFDF0;
  border: 2px solid #FFD54F;
  border-radius: 20px;
  padding: 28px 24px;
  width: 90%;
  max-width: 380px;
  box-shadow: 0 12px 40px rgba(255, 237, 107, 0.3), inset 0 1px 0 rgba(255, 253, 240, 0.7);
  transform: translateY(20px) scale(0.95);
  transition: transform 0.3s cubic-bezier(.34, 1.3, .64, 1);
}

.modal-overlay.active .modal {
  transform: translateY(0) scale(1);
}

.modal-title {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #D05D1A;
  font-weight: 700;
  font-size: 1.05em;
  margin-bottom: 18px;
  text-shadow: 0 1px 2px rgba(255,255,255,0.6);
}

.modal-title-icon {
  width: 26px; height: 26px;
  background: url('https://i.postimg.cc/44Lbdy7K/1773404738205.png') center/contain no-repeat;
  image-rendering: pixelated;
  animation: wiggle 2.8s ease-in-out infinite;
}

.modal label {
  display: block;
  color: #D05D1A;
  font-weight: 700;
  font-size: 0.85em;
  margin-bottom: 6px;
  margin-top: 14px;
}

.modal label:first-of-type {
  margin-top: 0;
}

.modal input[type="text"] {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid rgba(255, 213, 79, 0.55);
  border-radius: 12px;
  background: linear-gradient(180deg, #FFFDF0 0%, #FFF8CC 100%);
  color: #D05D1A;
  font-size: 1em;
  font-weight: 700;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.modal input[type="text"]:focus {
  border-color: #F5A623;
  box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15);
}

.modal input[type="text"]::placeholder {
  color: #D05D1A;
  opacity: 0.3;
  font-weight: 400;
}

.modal-hint {
  font-size: 0.75em;
  color: #D05D1A;
  opacity: 0.45;
  margin-top: 4px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}

.btn-cancel {
  flex: 1;
  padding: 10px;
  background: transparent;
  border: 1.5px solid rgba(208, 93, 26, 0.2);
  border-radius: 12px;
  color: #D05D1A;
  font-weight: 700;
  font-size: 0.9em;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

.btn-cancel:hover {
  background: rgba(255, 250, 220, 0.5);
  border-color: rgba(208, 93, 26, 0.35);
}

.btn-confirm {
  flex: 1.5;
  padding: 10px;
  background: linear-gradient(135deg, #F5A623 0%, #E8871E 100%);
  border: none;
  border-radius: 12px;
  color: #fff;
  font-weight: 700;
  font-size: 0.9em;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 3px 12px rgba(245, 166, 35, 0.35);
  transition: all 0.2s;
  text-shadow: 0 1px 2px rgba(0,0,0,0.15);
}

.btn-confirm:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 18px rgba(245, 166, 35, 0.45);
}

.btn-confirm:active {
  transform: translateY(0);
}

.btn-confirm:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

/* ====== 弹幕动画 ====== */
@keyframes danmakuFloat {
  0% { transform: translateX(0); }
  100% { transform: translateX(calc(-100vw - 100%)); }
}

/* ====== 工具按钮通用 ====== */
.tool-btn {
  position: fixed;
  z-index: 99;
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 213, 79, 0.55);
  background: rgba(255, 253, 240, 0.92);
  color: #D05D1A;
  font-size: 1em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(255, 237, 107, 0.3);
  transition: all 0.2s;
}

.tool-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 4px 14px rgba(255, 237, 107, 0.4);
}

.btn-pause {
  bottom: 76px;
  right: 16px;
}

.btn-list-view {
  bottom: 76px;
  right: 64px;
}

/* ====== 列表视图 ====== */
.list-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(208, 93, 26, 0.1);
  backdrop-filter: blur(4px);
  z-index: 150;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.list-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.list-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 360px;
  max-width: 90vw;
  background: linear-gradient(180deg, #FFFDF0 0%, #FFF8CC 60%, #FFF5A5 100%);
  border-left: 2px solid #FFD54F;
  box-shadow: -4px 0 20px rgba(255, 237, 107, 0.25);
  z-index: 151;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(.34, 1.3, .64, 1);
}

.list-overlay.active .list-panel {
  transform: translateX(0);
}

.list-panel-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(90deg, #FFFADC 0%, #FFF5A5 45%, #FFED6B 100%);
  border-bottom: 2.5px dashed #FFD54F;
}

.list-panel-title {
  color: #D05D1A;
  font-weight: 700;
  font-size: 0.95em;
}

.btn-close-list {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1.5px solid rgba(208, 93, 26, 0.2);
  background: transparent;
  color: #D05D1A;
  font-size: 1em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.btn-close-list:hover {
  background: rgba(255, 250, 220, 0.5);
}

.list-panel-content {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
}

.list-panel-content::-webkit-scrollbar { width: 6px; }
.list-panel-content::-webkit-scrollbar-track {
  background: linear-gradient(180deg, rgba(255,250,220,.2), rgba(255,245,165,.15));
  border-radius: 3px;
}
.list-panel-content::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #FFED6B 0%, #FFD54F 50%, #FFC107 100%);
  border-radius: 3px;
}

.list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: 12px;
  margin-bottom: 6px;
  background: rgba(255, 253, 240, 0.65);
  border: 1px solid rgba(255, 213, 79, 0.25);
  transition: all 0.15s;
}

.list-item:hover {
  background: rgba(255, 250, 220, 0.9);
  border-color: rgba(255, 213, 79, 0.5);
}

.list-item-left {
  flex: 1;
  min-width: 0;
  cursor: pointer;
}

.list-item-content {
  color: #D05D1A;
  font-weight: 700;
  font-size: 1em;
}

.list-item-author {
  color: #D05D1A;
  opacity: 0.45;
  font-size: 0.7em;
  font-weight: 400;margin-top: 2px;
}

.list-item-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  margin-left: 8px;
}

.list-item-copy {
  font-size: 0.65em;
  color: #D05D1A;
  opacity: 0.35;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  transition: all 0.15s;
}

.list-item-copy:hover {
  opacity: 0.7;
  background: rgba(255, 245, 165, 0.5);
}

.list-item-delete {
  font-size: 0.65em;
  color: #D05D1A;
  opacity: 0.25;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  transition: all 0.15s;
}

.list-item-delete:hover {
  opacity: 0.7;
  background: rgba(232, 135, 30, 0.1);
  color: #c0392b;
}

/* ====== 删除确认弹窗 ====== */
.delete-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(208, 93, 26, 0.2);
  backdrop-filter: blur(4px);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.delete-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.delete-modal {
  background: #FFFDF0;
  border: 2px solid #FFD54F;
  border-radius: 20px;
  padding: 24px 22px;
  width: 85%;
  max-width: 340px;
  box-shadow: 0 12px 40px rgba(255, 237, 107, 0.3);
  transform: translateY(20px) scale(0.95);
  transition: transform 0.3s cubic-bezier(.34, 1.3, .64, 1);
}

.delete-overlay.active .delete-modal {
  transform: translateY(0) scale(1);
}

.delete-modal-title {
  color: #D05D1A;
  font-weight: 700;
  font-size: 0.95em;
  margin-bottom: 6px;
}

.delete-modal-preview {
  color: #D05D1A;
  font-size: 1.3em;
  font-weight: 700;
  text-align: center;
  padding: 10px;
  margin: 10px 0;
  background: rgba(255, 245, 165, 0.3);
  border-radius: 10px;
}

.delete-modal label {
  display: block;
  color: #D05D1A;
  font-weight: 700;
  font-size: 0.8em;
  margin-bottom: 6px;
  margin-top: 12px;
}

.delete-modal input[type="password"] {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid rgba(255, 213, 79, 0.55);
  border-radius: 10px;
  background: linear-gradient(180deg, #FFFDF0 0%, #FFF8CC 100%);
  color: #D05D1A;
  font-size: 0.9em;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.delete-modal input[type="password"]:focus {
  border-color: #F5A623;
  box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15);
}

.delete-modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.btn-delete-cancel {
  flex: 1;
  padding: 9px;
  background: transparent;
  border: 1.5px solid rgba(208, 93, 26, 0.2);
  border-radius: 10px;
  color: #D05D1A;
  font-weight: 700;
  font-size: 0.85em;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

.btn-delete-cancel:hover {
  background: rgba(255, 250, 220, 0.5);
}

.btn-delete-confirm {
  flex: 1;
  padding: 9px;
  background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-weight: 700;
  font-size: 0.85em;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 3px 10px rgba(231, 76, 60, 0.3);
  transition: all 0.2s;
}

.btn-delete-confirm:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 16px rgba(231, 76, 60, 0.4);
}

.btn-delete-confirm:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

.delete-error {
  color: #c0392b;
  font-size: 0.75em;
  font-weight: 700;
  margin-top: 6px;
  min-height: 1em;
}

/* ====== 响应式 ====== */
@media (max-width: 480px) {
  .danmaku-item { font-size: 1em; padding: 5px 12px; }
  .header { padding: 10px 14px; }
  .header-title { font-size: 0.95em; }
  .footer { padding: 10px 14px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<!--顶部 -->
<div class="header">
  <div class="header-icon"></div>
  <div class="header-title">✦ 颜文字收集墙 ✦</div>
  <div class="header-toast"></div>
</div>

<!--弹幕区 -->
<div class="danmaku-stage" id="stage"></div>

<!-- 复制反馈 -->
<div class="copy-toast" id="copyToast">已复制！ (ᐢ..ᐢ)✧</div>

<!-- 工具按钮 -->
<button class="tool-btn btn-pause" id="btnPause" title="暂停/继续">⏸</button>
<button class="tool-btn btn-list-view" id="btnListView" title="列表查看">☰</button>

<!-- 底部 -->
<div class="footer">
  <div class="footer-count" id="footerCount">收集中...</div>
  <button class="btn-submit" id="btnSubmit"><span class="btn-submit-icon"></span>
    投个颜文字！
  </button>
</div>

<!-- 投稿弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title">
      <div class="modal-title-icon"></div>
      投稿颜文字！
    </div>
    <label for="inputKaomoji">你的颜文字</label>
    <input type="text" id="inputKaomoji" placeholder="(｡･ω･｡)" maxlength="100" autocomplete="off">
    <div class="modal-hint">100字符以内～</div>
    <label for="inputAuthor">你的名字（选填）</label>
    <input type="text" id="inputAuthor" placeholder="不填就匿名啦～" maxlength="20" autocomplete="off">
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancel">算了</button>
      <button class="btn-confirm" id="btnConfirm">发射！</button>
    </div>
  </div>
</div>

<!-- 列表视图 -->
<div class="list-overlay" id="listOverlay">
  <div class="list-panel">
    <div class="list-panel-header">
      <div class="list-panel-title">全部颜文字</div>
      <button class="btn-close-list" id="btnCloseList">✕</button>
    </div>
    <div class="list-panel-content" id="listContent"></div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="delete-overlay" id="deleteOverlay">
  <div class="delete-modal">
    <div class="delete-modal-title">确定要删除这个颜文字吗？</div>
    <div class="delete-modal-preview" id="deletePreview"></div>
    <label for="deletePassword">管理密码</label>
    <input type="password" id="deletePassword" placeholder="输入管理密码" autocomplete="off">
    <div class="delete-error" id="deleteError"></div>
    <div class="delete-modal-actions">
      <button class="btn-delete-cancel" id="btnDeleteCancel">算了</button>
      <button class="btn-delete-confirm" id="btnDeleteConfirm">删除</button>
    </div>
  </div>
</div>

<script>
(function() {
  const stage = document.getElementById('stage');
  const copyToast = document.getElementById('copyToast');
  const footerCount = document.getElementById('footerCount');
  const btnSubmit = document.getElementById('btnSubmit');
  const btnPause = document.getElementById('btnPause');
  const btnListView = document.getElementById('btnListView');
  const modalOverlay = document.getElementById('modalOverlay');
  const inputKaomoji = document.getElementById('inputKaomoji');
  const inputAuthor = document.getElementById('inputAuthor');
  const btnCancel = document.getElementById('btnCancel');
  const btnConfirm = document.getElementById('btnConfirm');
  const listOverlay = document.getElementById('listOverlay');
  const listContent = document.getElementById('listContent');
  const btnCloseList = document.getElementById('btnCloseList');
  const deleteOverlay = document.getElementById('deleteOverlay');
  const deletePreview = document.getElementById('deletePreview');
  const deletePassword = document.getElementById('deletePassword');
  const deleteError = document.getElementById('deleteError');
  const btnDeleteCancel = document.getElementById('btnDeleteCancel');
  const btnDeleteConfirm = document.getElementById('btnDeleteConfirm');

  let allKaomoji = [];
  let isPaused = false;
  let danmakuPool = [];
  let spawnTimer = null;
  let deleteTargetId = null;

  // 加载数据
  async function loadData() {
    try {
      const res = await fetch('/api/kaomoji');
      allKaomoji = await res.json();
      footerCount.textContent = '已收集 ' + allKaomoji.length + ' 个颜文字 ✦';
      startDanmaku();
    } catch (e) {
      footerCount.textContent = '加载失败了… (╥﹏╥)';
    }
  }

  // 生成弹幕
  function spawnDanmaku(item) {
    const el = document.createElement('div');
    el.className = 'danmaku-item';

    let html = escapeHtml(item.content);
    if (item.author) {
      html += '<span class="danmaku-author">— ' + escapeHtml(item.author) + '</span>';
    }
    el.innerHTML = html;

    const stageH = stage.offsetHeight;
    const itemH = 42;
    const lanes = Math.max(1, Math.floor((stageH - 20) / (itemH + 12)));
    const lane = Math.floor(Math.random() * lanes);
    const top = 10 + lane * (itemH + 12) + Math.random() * 6;

    el.style.top = top + 'px';
    el.style.right = '-400px';

    // 速度加快：8~18秒
    const duration = 8 + Math.random() * 10;
    const scale = 0.9 + Math.random() * 0.35;
    el.style.fontSize = scale + 'em';
    el.style.animationName = 'danmakuFloat';
    el.style.animationDuration = duration + 's';

    if (isPaused) {
      el.style.animationPlayState = 'paused';
    }

    el.addEventListener('click', function(e) {
      e.stopPropagation();
      copyToClipboard(item.content);
    });

    stage.appendChild(el);
    danmakuPool.push(el);

    el.addEventListener('animationend', function() {
      el.remove();
      const idx = danmakuPool.indexOf(el);
      if (idx > -1) danmakuPool.splice(idx, 1);
    });
  }

  function startDanmaku() {
    if (spawnTimer) clearInterval(spawnTimer);
    if (allKaomoji.length === 0) return;

    var initial = Math.min(allKaomoji.length, 8);
    for (var i = 0; i < initial; i++) {
      (function(idx) {
        setTimeout(function() {
          if (!isPaused && allKaomoji.length > 0) {
            spawnDanmaku(allKaomoji[idx % allKaomoji.length]);
          }
        }, idx * 500);
      })(i);
    }

    spawnTimer = setInterval(function() {
      if (isPaused || allKaomoji.length === 0) return;
      var item = allKaomoji[Math.floor(Math.random() * allKaomoji.length)];
      spawnDanmaku(item);
    }, 1800+ Math.random() * 1000);
  }

  // 复制
  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopyToast).catch(function() {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    showCopyToast();
  }

  var copyToastTimer = null;
  function showCopyToast() {
    copyToast.classList.add('show');
    if (copyToastTimer) clearTimeout(copyToastTimer);
    copyToastTimer = setTimeout(function() {
      copyToast.classList.remove('show');
    }, 1200);
  }

  // 暂停
  btnPause.addEventListener('click', function() {
    isPaused = !isPaused;
    btnPause.textContent = isPaused ? '▶' : '⏸';
    danmakuPool.forEach(function(el) {
      el.style.animationPlayState = isPaused ? 'paused' : 'running';
    });
  });

  // 投稿弹窗
  btnSubmit.addEventListener('click', function() {
    modalOverlay.classList.add('active');
    inputKaomoji.value = '';
    inputAuthor.value = '';
    setTimeout(function() { inputKaomoji.focus(); }, 300);
  });

  btnCancel.addEventListener('click', function() {
    modalOverlay.classList.remove('active');
  });

  modalOverlay.addEventListener('click', function(e) {
    if (e.target === modalOverlay) modalOverlay.classList.remove('active');
  });

  btnConfirm.addEventListener('click', submitKaomoji);

  inputKaomoji.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submitKaomoji();
  });
  inputAuthor.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submitKaomoji();
  });

  async function submitKaomoji() {
    var content = inputKaomoji.value.trim();
    if (!content) { inputKaomoji.focus(); return; }
    btnConfirm.disabled = true;
    btnConfirm.textContent = '发射中...';
    try {
      var res = await fetch('/api/kaomoji', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: content, author: inputAuthor.value.trim() })
      });
      if (!res.ok) {
        var err = await res.json();
        alert(err.error || '发射失败了 (╥﹏╥)');
        return;
      }
      var newItem = await res.json();
      allKaomoji.unshift(newItem);
      footerCount.textContent = '已收集 ' + allKaomoji.length + ' 个颜文字 ✦';
      modalOverlay.classList.remove('active');
      spawnDanmaku(newItem);
    } catch (e) {
      alert('网络出错了 (╥﹏╥)');
    } finally {
      btnConfirm.disabled = false;
      btnConfirm.textContent = '发射！';
    }
  }

  // 列表视图
  btnListView.addEventListener('click', function() {
    renderList();
    listOverlay.classList.add('active');
  });

  btnCloseList.addEventListener('click', function() {
    listOverlay.classList.remove('active');
  });

  listOverlay.addEventListener('click', function(e) {
    if (e.target === listOverlay) listOverlay.classList.remove('active');
  });

  function renderList() {
    listContent.innerHTML = '';
    allKaomoji.forEach(function(item) {
      var el = document.createElement('div');
      el.className = 'list-item';
      el.innerHTML =
        '<div class="list-item-left">' +
          '<div class="list-item-content">' + escapeHtml(item.content) + '</div>' +
          (item.author ? '<div class="list-item-author">— ' + escapeHtml(item.author) + '</div>' : '') +
        '</div>' +
        '<div class="list-item-actions">' +
          '<span class="list-item-copy" data-action="copy">复制</span>' +
          '<span class="list-item-delete" data-action="delete">删除</span>' +
        '</div>';

      el.querySelector('.list-item-left').addEventListener('click', function() {
        copyToClipboard(item.content);
      });
      el.querySelector('[data-action="copy"]').addEventListener('click', function(e) {
        e.stopPropagation();
        copyToClipboard(item.content);
      });
      el.querySelector('[data-action="delete"]').addEventListener('click', function(e) {
        e.stopPropagation();
        openDeleteModal(item);
      });

      listContent.appendChild(el);
    });
  }

  // 删除功能
  function openDeleteModal(item) {
    deleteTargetId = item.id;
    deletePreview.textContent = item.content;
    deletePassword.value = '';
    deleteError.textContent = '';
    deleteOverlay.classList.add('active');
    setTimeout(function() { deletePassword.focus(); }, 300);
  }

  btnDeleteCancel.addEventListener('click', function() {
    deleteOverlay.classList.remove('active');deleteTargetId = null;
  });

  deleteOverlay.addEventListener('click', function(e) {
    if (e.target === deleteOverlay) {
      deleteOverlay.classList.remove('active');
      deleteTargetId = null;
    }
  });

  deletePassword.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doDelete();
  });

  btnDeleteConfirm.addEventListener('click', doDelete);

  async function doDelete() {
    if (!deleteTargetId) return;
    var pw = deletePassword.value;
    if (!pw) { deleteError.textContent = '请输入管理密码～'; return; }
    btnDeleteConfirm.disabled = true;
    btnDeleteConfirm.textContent = '删除中...';
    deleteError.textContent = '';
    try {
      var res = await fetch('/api/kaomoji/' + deleteTargetId, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      if (!res.ok) {
        var err = await res.json();
        deleteError.textContent = err.error || '删除失败了';
        return;
      }
      // 从本地数据移除
      allKaomoji = allKaomoji.filter(function(k) { return k.id !== deleteTargetId; });
      footerCount.textContent = '已收集 ' + allKaomoji.length + ' 个颜文字 ✦';
      deleteOverlay.classList.remove('active');
      deleteTargetId = null;
      renderList();
    } catch (e) {
      deleteError.textContent = '网络出错了…';
    } finally {
      btnDeleteConfirm.disabled = false;
      btnDeleteConfirm.textContent = '删除';
    }
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // 启动！
  loadData();
})();
</script>

</body>
</html>
